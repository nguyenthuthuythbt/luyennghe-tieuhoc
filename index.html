<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extra Listening - Primary</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f6efe0;color:#1d2b4f;text-align:center}
header{background:#1d2b4f;color:#f2b632;padding:22px 12px}
h1{margin:0;font-size:clamp(28px,6vw,48px)} .by{font-size:20px;color:#fff;font-weight:bold;margin-top:8px}
.grades{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:22px}
.grades button{font-size:26px;font-weight:bold;padding:16px 28px;border:0;border-radius:14px;background:#2a9d8f;color:#fff;cursor:pointer}
.grades button.on{background:#e76f51}
#units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:1000px;margin:0 auto;padding:10px 18px 40px}
#units a{display:block;padding:18px 10px;background:#fff;border:3px solid #1d2b4f;border-radius:14px;color:#1d2b4f;text-decoration:none;font-size:22px;font-weight:bold}
#units a small{display:block;font-weight:normal;font-size:18px;margin-top:6px}
#units a:hover{background:#f2b632}
</style></head><body>
<header><h1>Extra Listening</h1><div class="by">Created by Nguyen Thi Thu Thuy</div></header>
<div class="grades" id="g"></div><div id="units"></div>
<script>
var D={"1": [[1, "School playground"], [2, "Dining room"], [3, "Street market"], [4, "Bedroom"], [5, "Fish and chip shop"], [6, "Classroom"], [7, "Garden"]], "2": [[1, "Birthday party"], [2, "In the backyard"], [3, "At the seaside"], [4, "In the countryside"], [5, "In the classroom"], [6, "On the farm"], [7, "In the kitchen"], [8, "In the village"]], "3": [[1, "Hello"], [2, "Our names"], [3, "Our friends"], [4, "Our bodies"], [5, "My hobbies"], [6, "Our school"], [7, "Classroom instructions"], [8, "My school things"], [9, "Colours"], [10, "Break time activities"]], "4": [[3, "My week"], [4, "My birthday party"], [5, "Things we can do"], [6, "Our school facilities"], [7, "Our timetables"], [8, "My favourite subjects"], [9, "Our sports day"], [10, "Our summer holidays"]], "5": [[1, "All about me"], [2, "Our homes"], [3, "My foreign friends"], [4, "Our free time activities"], [5, "My future job"], [6, "Our school rooms"], [7, "Our favourite school activities"], [8, "In our classroom"], [9, "Our outdoor activities"], [10, "Our school trip"]]};
var g=document.getElementById('g'),u=document.getElementById('units');
function show(n){[].forEach.call(g.children,function(b){b.className=b.dataset.n==n?'on':''});
u.innerHTML=D[n].map(function(x){return '<a href="extra-listening/lop-'+n+'/unit'+x[0]+'.html">Unit '+x[0]+'<small>'+x[1]+'</small></a>'}).join('');}
for(var n=1;n<=5;n++){var b=document.createElement('button');b.textContent='Grade '+n;b.dataset.n=n;b.onclick=(function(n){return function(){show(n)}})(n);g.appendChild(b);}
show(1);
</script></body></html>
